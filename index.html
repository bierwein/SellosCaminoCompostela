<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Foto-Automat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link
href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wg
ht@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
--cream:#FFF7E9;
--navy:#1C1B3A;
--coral:#FF5A5F;
--mustard:#FFC53D;
--mint:#3EC9B0;
--paper:#FFFDF8;
}
*{box-sizing:border-box;}
html,body{
margin:0;padding:0;height:100%;
background:var(--cream);
font-family:'Nunito',sans-serif;
color:var(--navy);
overflow:hidden;
}
body{
background-image:
radial-gradient(circle, rgba(28,27,58,0.08) 1.4px, transparent 1.4px);
background-size:18px 18px;
}
#app{
position:relative;
width:100%;
height:100vh;
max-width:480px;
margin:0 auto;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:20px;
overflow:hidden;
}
.screen{
position:absolute;
inset:0; display:none;
flex-direction:column;
align-items:center;
justify-content:center;
padding:22px 20px;
text-align:center;
}
.screen.active{ display:flex; }
h1{
font-family:'Baloo 2',sans-serif;
font-weight:800;
font-size:2.1rem;
margin:0 0 6px;
color:var(--navy);
line-height:1.05;
}
.sub{
font-size:1rem;
color:#5c5a7d;
margin:0 0 28px;
max-width:320px;
}
/* ---------- Intro ---------- */
.lens-badge{
width:120px;height:120px;border-radius:50%;
background:var(--coral);
display:flex;align-items:center;justify-content:center;
font-size:52px;
margin-bottom:22px;
box-shadow:0 0 0 8px var(--paper), 0 0 0 11px var(--navy);
animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{
0%,100%{ transform:scale(1); }
50%{ transform:scale(1.05); }
}
.btn{
font-family:'Baloo 2',sans-serif;
font-weight:700;
font-size:1.15rem;
border:none;
border-radius:999px;
padding:16px 40px;
background:var(--navy);
color:var(--cream);
cursor:pointer; box-shadow:0 5px 0 #0d0c22;
transition:transform .08s ease;
}
.btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #0d0c22; }
.btn.secondary{
background:var(--paper);
color:var(--navy);
box-shadow:0 5px 0 #d8cfb5;
}
.btn.secondary:active{ box-shadow:0 1px 0 #d8cfb5; }
.btn.small{
font-size:0.95rem;
padding:11px 26px;
box-shadow:0 4px 0 #0d0c22;
}
.btn.small:active{ box-shadow:0 1px 0 #0d0c22; }
.btn.ghost{
background:transparent;
color:var(--navy);
box-shadow:none;
border:2px solid var(--navy);
}
.btn.ghost:active{ transform:scale(0.97); }
/* ---------- Camera / countdown ---------- */
.ring-wrap{
position:relative;
width:min(68vw,260px);
height:min(68vw,260px);
margin-bottom:16px;
}
.ring-wrap svg{
position:absolute; inset:0;
transform:rotate(-90deg);
}
.ring-bg{ fill:none; stroke:#E9E1CB; stroke-width:8; }
.ring-fg{
fill:none; stroke:var(--coral); stroke-width:8; stroke-linecap:round;
}
.cam-circle{
position:absolute;
top:14px; left:14px; right:14px; bottom:14px;
border-radius:50%;
overflow:hidden;
background:var(--navy);
display:flex;align-items:center;justify-content:center;
}
.cam-circle video{ width:100%;height:100%;object-fit:cover;
transform:scaleX(-1);
}
.cam-circle .cam-fallback{
color:var(--cream); font-size:0.85rem; padding:18px; line-height:1.4;
}
.countdown-num{
position:absolute;
bottom:-6px; right:-2px;
background:var(--mustard);
color:var(--navy);
font-family:'Baloo 2',sans-serif;
font-weight:800;
font-size:1.5rem;
width:52px;height:52px;
border-radius:50%;
display:flex;align-items:center;justify-content:center;
box-shadow:0 0 0 5px var(--cream);
}
.hint-text{
font-family:'Baloo 2',sans-serif;
font-weight:700;
font-size:1.3rem;
min-height:1.6em;
color:var(--navy);
}
.float-emoji{
position:absolute;
font-size:1.6rem;
animation:floatUp 2.6s ease-in forwards;
pointer-events:none;
}
@keyframes floatUp{
0%{ transform:translateY(0) rotate(0deg); opacity:0; }
12%{ opacity:1; }
100%{ transform:translateY(-160px) rotate(20deg); opacity:0; }
}
/* ---------- Stamp / selection ---------- */
.stamp-holder{
width:min(64vw,236px);
height:min(64vw,236px);
border-radius:50%;
margin-bottom:18px;
box-shadow:0 10px 24px rgba(28,27,58,0.22);
background:var(--paper);
display:flex;align-items:center;justify-content:center;
overflow:hidden; }
.stamp-holder img{
width:100%;height:100%;object-fit:contain;
}
.select-timer{
font-family:'Baloo 2',sans-serif;
font-weight:700;
font-size:0.95rem;
color:#8b869f;
margin-bottom:12px;
}
.select-timer b{ color:var(--coral); }
.choices{
display:flex; flex-direction:column; gap:10px; width:100%; max-width:300px;
}
.choice-btn{
font-family:'Nunito',sans-serif;
font-weight:700;
font-size:1rem;
padding:13px 18px;
border-radius:14px;
border:2px solid var(--navy);
background:var(--paper);
color:var(--navy);
cursor:pointer;
transition:transform .08s ease, background .15s ease, color .15s ease;
}
.choice-btn:active{ transform:scale(0.97); }
.choice-btn.active-choice{
background:var(--navy); color:var(--cream);
}
.select-actions{
margin-top:16px;
display:flex; gap:10px; width:100%; max-width:300px;
}
.select-actions .btn{ flex:1; }
.done-actions{ margin-top:20px; display:none; }
.flash{
position:fixed; inset:0; background:#fff; opacity:0;
pointer-events:none; z-index:50;
}
.flash.go{ animation:flashPop .35s ease-out; }
@keyframes flashPop{ 0%{ opacity:0.9; } 100%{ opacity:0; }
}
footer.credit{
position:absolute; bottom:10px; font-size:0.7rem; color:#a8a3bd;
}
</style>
</head>
<body>
<div id="app">
<div class="screen active" id="screen-intro">
<div class="lens-badge">🤳</div>
<h1>Foto-Automat</h1>
<p class="sub">Du hast 10 Sekunden, um dich bereit zu machen &mdash; oder du klickst
dich einfach durch.</p>
<button class="btn" id="btn-start">Los geht's</button>
</div>
<div class="screen" id="screen-camera">
<div class="hint-text" id="hint-text">Bereit machen&hellip;</div>
<div class="ring-wrap" id="ring-wrap" style="margin-top:14px;">
<svg viewBox="0 0 200 200">
<circle class="ring-bg" cx="100" cy="100" r="90"></circle>
<circle class="ring-fg" id="ring-fg" cx="100" cy="100" r="90"
stroke-dasharray="565.5" stroke-dashoffset="0"></circle>
</svg>
<div class="cam-circle" id="cam-circle">
<video id="video" autoplay playsinline muted></video>
</div>
<div class="countdown-num" id="camera-count">10</div>
</div>
<button class="btn secondary small" id="btn-capture-now">Jetzt aufnehmen</button>
</div>
<div class="screen" id="screen-select">
<div class="stamp-holder" id="stamp-holder">
<img id="stamp-img" alt="Dein Stempel">
</div>
<div class="select-timer" id="select-timer">Wähle deinen Favoriten &mdash; noch <b
id="select-count">10</b>s</div>
<div class="choices" id="choices"></div>
<div class="select-actions" id="select-actions">
<button class="btn small" id="btn-finish">Fertig</button>
</div>
<div class="done-actions" id="done-actions">
<button class="btn secondary" id="btn-again">Nochmal</button>
</div> </div>
<footer class="credit">Foto-Automat</footer>
</div>
<div class="flash" id="flash"></div>
<canvas id="canvas" style="display:none;"></canvas>
<script>
(function(){
const screens = {
intro: document.getElementById('screen-intro'),
camera: document.getElementById('screen-camera'),
select: document.getElementById('screen-select'),
};
function showScreen(name){
Object.values(screens).forEach(s => s.classList.remove('active'));
screens[name].classList.add('active');
}
const btnStart = document.getElementById('btn-start');
const btnCaptureNow = document.getElementById('btn-capture-now');
const btnFinish = document.getElementById('btn-finish');
const btnAgain = document.getElementById('btn-again');
const video = document.getElementById('video');
const camCircle = document.getElementById('cam-circle');
const ringFg = document.getElementById('ring-fg');
const cameraCount = document.getElementById('camera-count');
const hintText = document.getElementById('hint-text');
const ringWrap = document.getElementById('ring-wrap');
const flash = document.getElementById('flash');
const canvas = document.getElementById('canvas');
const stampImg = document.getElementById('stamp-img');
const selectCount = document.getElementById('select-count');
const choicesWrap = document.getElementById('choices');
const selectTimerWrap = document.getElementById('select-timer');
const selectActions = document.getElementById('select-actions');
const doneActions = document.getElementById('done-actions');
const CIRC = 2 * Math.PI * 90;
const CAPTIONS = [
'Bereit für den Ruhm',
'Frisch gestempelt',
'Legendärer Moment'
];
const PHRASES = ['Bereit machen…', 'Lächeln!', 'Fast geschafft…', 'Und… Klick!'];
const FACE_EMOJI = ['😆','🤳','😎','🥳','😜']; let stream = null;
let countdownTimer = null;
let phraseTimer = null;
let emojiTimer = null;
let selectTimer = null;
let selectionFinalized = false;
let selectedIndex = 0;
let stampBaseCanvas = null; // round b/w base without caption
async function startCamera(){
try{
stream = await navigator.mediaDevices.getUserMedia({
video:{ facingMode:'user' }, audio:false
});
video.srcObject = stream;
}catch(err){
camCircle.innerHTML = '<div class="cam-fallback">Kein Kamerazugriff möglich. Bitte
Berechtigung erlauben oder diese Seite in einem eigenen Browser-Tab öffnen.</div>';
}
}
function stopCamera(){
if(stream){
stream.getTracks().forEach(t => t.stop());
stream = null;
}
}
function spawnEmoji(){
const el = document.createElement('div');
el.className = 'float-emoji';
el.textContent = FACE_EMOJI[Math.floor(Math.random()*FACE_EMOJI.length)];
el.style.left = (10 + Math.random()*80) + '%';
el.style.bottom = '10%';
ringWrap.appendChild(el);
setTimeout(() => el.remove(), 2700);
}
function clearCameraTimers(){
clearInterval(countdownTimer);
clearInterval(phraseTimer);
clearInterval(emojiTimer);
}
function runCameraCountdown(){
let t = 10;
cameraCount.textContent = t;
ringFg.style.strokeDasharray = CIRC; ringFg.style.strokeDashoffset = 0;
ringFg.style.transition = 'none';
requestAnimationFrame(() => {
ringFg.style.transition = 'stroke-dashoffset 10s linear';
ringFg.style.strokeDashoffset = CIRC;
});
let phraseIdx = 0;
hintText.textContent = PHRASES[0];
phraseTimer = setInterval(() => {
phraseIdx = (phraseIdx + 1) % PHRASES.length;
hintText.textContent = PHRASES[phraseIdx];
}, 2200);
emojiTimer = setInterval(spawnEmoji, 650);
countdownTimer = setInterval(() => {
t -= 1;
cameraCount.textContent = Math.max(t,0);
if(t <= 0){
clearCameraTimers();
capturePhoto();
}
}, 1000);
}
function capturePhoto(){
clearCameraTimers();
flash.classList.add('go');
const size = Math.min(video.videoWidth || 480, video.videoHeight || 480);
canvas.width = size;
canvas.height = size;
const ctx = canvas.getContext('2d');
if(video.videoWidth){
const sx = (video.videoWidth - size)/2;
const sy = (video.videoHeight - size)/2;
// mirror the capture so it matches what the user saw in the preview
ctx.save();
ctx.translate(size,0);
ctx.scale(-1,1);
ctx.drawImage(video, sx, sy, size, size, 0, 0, size, size);
ctx.restore();
}
stopCamera();
stampBaseCanvas = makeStampBase(canvas, 320);
setTimeout(() => { flash.classList.remove('go');
showScreen('select');
startSelection();
}, 250);
}
// ---------- Stamp image generation ----------
function makeStampBase(sourceCanvas, size){
const out = document.createElement('canvas');
out.width = size; out.height = size;
const ctx = out.getContext('2d');
ctx.fillStyle = '#FFFDF8';
ctx.beginPath();
ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
ctx.fill();
ctx.save();
ctx.beginPath();
ctx.arc(size/2, size/2, size/2 - 10, 0, Math.PI*2);
ctx.clip();
ctx.drawImage(sourceCanvas, 0, 0, size, size);
ctx.restore();
const imgData = ctx.getImageData(0, 0, size, size);
const d = imgData.data;
const inkR = 28, inkG = 27, inkB = 58;
const paperR = 255, paperG = 253, paperB = 248;
for(let i = 0; i < d.length; i += 4){
const a = d[i+3];
if(a === 0) continue;
let gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
gray = ((gray/255 - 0.5) * 1.55 + 0.5) * 255;
gray += (Math.random() - 0.5) * 16;
gray = Math.max(0, Math.min(255, gray));
const ink = 1 - gray/255;
d[i] = paperR*(1-ink) + inkR*ink;
d[i+1] = paperG*(1-ink) + inkG*ink;
d[i+2] = paperB*(1-ink) + inkB*ink;
}
ctx.putImageData(imgData, 0, 0);
ctx.strokeStyle = 'rgba(28,27,58,0.85)';
ctx.lineWidth = 4;
ctx.beginPath();
ctx.arc(size/2, size/2, size/2 - 6, 0, Math.PI*2);
ctx.stroke(); ctx.lineWidth = 1.5;
ctx.beginPath();
ctx.arc(size/2, size/2, size/2 - 14, 0, Math.PI*2);
ctx.stroke();
return out;
}
function drawArcTextBottom(ctx, text, cx, cy, radius, color, maxSpanDeg, basePx){
const maxSpanRad = maxSpanDeg * Math.PI/180;
let fontPx = basePx;
let chars, widths, anglesRad, totalAngleRad;
do{
ctx.font = `700 ${fontPx}px 'Baloo 2', sans-serif`;
chars = [...text];
widths = chars.map(c => ctx.measureText(c).width + fontPx*0.06);
anglesRad = widths.map(w => w/radius);
totalAngleRad = anglesRad.reduce((a,b) => a+b, 0);
if(totalAngleRad > maxSpanRad) fontPx -= 1;
} while(totalAngleRad > maxSpanRad && fontPx > 9);
ctx.fillStyle = color;
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
let theta = Math.PI/2 + totalAngleRad/2;
for(let i = 0; i < chars.length; i++){
theta -= anglesRad[i]/2;
const x = cx + radius*Math.cos(theta);
const y = cy + radius*Math.sin(theta);
ctx.save();
ctx.translate(x, y);
ctx.rotate(theta - Math.PI/2);
ctx.fillText(chars[i], 0, 0);
ctx.restore();
theta -= anglesRad[i]/2;
}
}
function renderStampWithCaption(caption){
if(!stampBaseCanvas) return;
const size = stampBaseCanvas.width;
const c = document.createElement('canvas');
c.width = size; c.height = size;
const ctx = c.getContext('2d');
ctx.drawImage(stampBaseCanvas, 0, 0);
drawArcTextBottom(ctx, caption.toUpperCase(), size/2, size/2, size*0.35, '#1C1B3A', 120,
24);
stampImg.src = c.toDataURL('image/png'); }
// ---------- Selection screen ----------
function buildChoiceButtons(){
choicesWrap.innerHTML = '';
CAPTIONS.forEach((text, idx) => {
const b = document.createElement('button');
b.className = 'choice-btn' + (idx === selectedIndex ? ' active-choice' : '');
b.textContent = text;
b.addEventListener('click', () => selectCaption(idx));
choicesWrap.appendChild(b);
});
}
function selectCaption(idx){
selectedIndex = idx;
Array.from(choicesWrap.children).forEach((btn, i) => {
btn.classList.toggle('active-choice', i === idx);
});
renderStampWithCaption(CAPTIONS[idx]);
}
function startSelection(){
selectionFinalized = false;
selectedIndex = 0;
doneActions.style.display = 'none';
selectTimerWrap.style.display = '';
choicesWrap.style.display = '';
selectActions.style.display = '';
buildChoiceButtons();
renderStampWithCaption(CAPTIONS[0]);
let t = 10;
selectCount.textContent = t;
selectTimer = setInterval(() => {
t -= 1;
selectCount.textContent = Math.max(t,0);
if(t <= 0){
finalizeSelection();
}
}, 1000);
}
function finalizeSelection(){
if(selectionFinalized) return;
selectionFinalized = true;
clearInterval(selectTimer); selectTimerWrap.style.display = 'none';
choicesWrap.style.display = 'none';
selectActions.style.display = 'none';
doneActions.style.display = '';
}
btnStart.addEventListener('click', async () => {
showScreen('camera');
camCircle.innerHTML = '';
camCircle.appendChild(video);
await startCamera();
runCameraCountdown();
});
btnCaptureNow.addEventListener('click', () => {
if(!video.srcObject) return;
capturePhoto();
});
btnFinish.addEventListener('click', finalizeSelection);
btnAgain.addEventListener('click', () => {
clearCameraTimers();
clearInterval(selectTimer);
showScreen('intro');
});
})();
</script>
</body>
</html>
